name: Update events and deploy

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:          # manual "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install scraper
        run: npm install --no-save --no-package-lock cheerio

      - name: Fetch events
        run: node scripts/fetch-events.mjs

      - name: Make app icons
        run: |
          npm install --no-save --no-package-lock sharp
          node scripts/make-icons.mjs
          rm -rf node_modules

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Update events $(date -u +%F)"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              echo "Push failed, retrying ($i)…"; sleep 5
            done
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
